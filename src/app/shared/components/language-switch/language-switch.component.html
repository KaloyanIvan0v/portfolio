<div class="language-switch">
  <div class="switch">
    <input
      type="checkbox"
      [id]="toggleId"
      aria-label="Switch language between English and German"
      [checked]="(currentLanguage$ | async) === 'de'"
      (change)="toggleLanguage()"
    />
    <label [attr.for]="toggleId" class="slider"></label>
  </div>
</div>
