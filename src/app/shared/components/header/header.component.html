<nav>
  <div class="wrapper">
    <div class="name">
      <a routerLink="/" fragment="hero">
        <img src="assets/img/06-header-section/kaloyan.png" alt="Kaloyan Ivanov logo" />
      </a>
    </div>
    @if (showMenu) {
      <div class="menu">
        <ul>
          <li>
            <a href="#about" (click)="setActive('about me')">
              {{ "header.menu.about" | translate }}</a
            >
            <div
              [ngClass]="{ 'purple-line': activeSection === 'about me' }"
              class="purple-line"
            ></div>
          </li>
          <li>
            <a href="#skills" (click)="setActive('skills')">{{
              "header.menu.skills" | translate
            }}</a>
            <div [ngClass]="{ 'purple-line': activeSection === 'skills' }"></div>
          </li>
          <li>
            <a href="#portfolio" (click)="setActive('portfolio')">{{
              "header.menu.portfolio" | translate
            }}</a>
            <div [ngClass]="{ 'purple-line': activeSection === 'portfolio' }"></div>
          </li>
        </ul>
        <app-language-switch></app-language-switch>
      </div>
      <button
        (click)="showMobileMenu()"
        class="burger-menu"
        aria-label="Open menu"
      >
        <img src="assets/img/06-header-section/burger-menu.png" alt="" />
      </button>
    } @else {
      <app-language-switch></app-language-switch>
    }
  </div>
</nav>
