<section id="portfolio">
  <div class="headline">
    <div class="purple-line-left"></div>
    <div class="portfolio-title"><p>Portfolio</p></div>
    <div class="purple-line-right"></div>
  </div>
  <div class="sub-headline">
    <p>{{ "portfolio.introduction" | translate }}</p>
  </div>
  @for (project of projects; track project.name; let i = $index) {
    <div class="single-project">
      <app-single-project [project]="project" [index]="i"></app-single-project>
    </div>
  }
  <div class="portfolio-shadow breathing-size">
    <img src="assets/img/03-portfolio-section/portfolio-shadow.svg" alt="" />
  </div>
</section>
